<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light">
<title>Moonlander</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:#fff;color:#141414;font:500 17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px;overflow:hidden}
.moon{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,#e9e9e9 60%,#d6d6d6);box-shadow:0 18px 50px rgba(0,0,0,.14);margin:0 auto 36px;animation:f 5s ease-in-out infinite}
@keyframes f{50%{transform:translateY(-12px)}}
h1{font-size:clamp(40px,10vw,84px);letter-spacing:-.045em;line-height:1.02;font-weight:600}
p{color:#767676;margin-top:16px;font-size:clamp(17px,4.4vw,22px)}
</style></head><body><main><div class="moon"></div><h1>Moonlander</h1><p>Something is landing soon.</p></main></body></html>
